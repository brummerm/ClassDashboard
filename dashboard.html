<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS Class Dashboard | BPHS</title>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #0d1117;
    color: #e6edf3;
    height: 100vh;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 8px;
  }

  /* ── DATE / TIME HEADER ── */
  .header {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 32px;
    padding: 10px 24px;
    flex-shrink: 0;
  }

  .header-time {
    font-size: 42px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.5px;
    line-height: 1;
    color: #e6edf3;
  }

  .header-date {
    font-size: 20px;
    font-weight: 500;
    color: #7d8590;
    line-height: 1.4;
  }

  /* ── FOUR EQUAL PANELS ── */
  .panels {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 8px;
    flex: 1;
    min-height: 0;
  }

  .panel {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .panel-header {
    padding: 8px 14px;
    background: #0d1117;
    border-bottom: 1px solid #30363d;
    font-size: 24px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: #7d8590;
    flex-shrink: 0;
  }

  .panel-body {
    flex: 1;
    overflow-y: auto;
    padding: 14px 16px;
  }

  .panel-body::-webkit-scrollbar { width: 4px; }
  .panel-body::-webkit-scrollbar-track { background: transparent; }
  .panel-body::-webkit-scrollbar-thumb { background: #30363d; border-radius: 2px; }

  /* ── CHECKLIST ── */
  .checklist-empty {
    color: #7d8590;
    font-size: 20px;
  }

  .checklist-item {
    display: flex;
    align-items: flex-start;
    gap: 11px;
    padding: 9px 0;
    border-bottom: 1px solid #21262d;
    font-size: 20px;
    line-height: 1.4;
    color: #c9d1d9;
  }

  .checklist-item:last-child { border-bottom: none; }

  .check-circle {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid #30363d;
    flex-shrink: 0;
    margin-top: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s, border-color 0.2s;
  }

  .checklist-item.done .check-circle {
    background: #238636;
    border-color: #238636;
  }

  .checklist-item.done .item-text {
    text-decoration: line-through;
    color: #7d8590;
  }

  /* ── NOTES ── */
  .notes-text {
    font-size: 18px;
    line-height: 1.8;
    color: #c9d1d9;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* ── CLASS COLOR PANEL ── */
  .class-panel {
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    text-align: center;
    padding: 20px 16px;
    transition: background-color 0.8s ease, color 0.8s ease, border-color 0.8s ease;
    background: #161b22;
    border: 1px solid #30363d;
    overflow: hidden;
  }

  .class-period-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    opacity: 0.7;
  }

  .class-name-big {
    font-size: 58px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    line-height: 1;
  }

  .class-time-range {
    font-size: 14px;
    opacity: 0.8;
    margin-top: 4px;
  }

  .class-remaining {
    font-size: 11px;
    opacity: 0.55;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-top: 2px;
  }

  /* ── YOUTUBE ── */
  .yt-body {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: #000;
  }

  .yt-body iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }

  .yt-placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: #30363d;
    gap: 14px;
  }

  .yt-placeholder svg  { width: 52px; height: 52px; }
  .yt-placeholder span { font-size: 15px; font-weight: 500; }

  .yt-error-state {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 12px;
    padding: 24px;
    text-align: center;
  }

  .yt-error-state .err-icon  { font-size: 32px; }
  .yt-error-state .err-title { font-size: 15px; font-weight: 700; color: #f85149; }
  .yt-error-state .err-sub   { font-size: 13px; color: #8b949e; }
</style>
</head>
<body>

<!-- DATE / TIME HEADER -->
<div class="header">
  <div class="header-time" id="clock">--:-- --</div>
  <div class="header-date" id="date-display">Loading...</div>
</div>

<!-- FOUR EQUAL PANELS -->
<div class="panels">

  <!-- Panel 1: Checklist -->
  <div class="panel">
    <div class="panel-header">Assignment Completion Checklist</div>
    <div class="panel-body" id="checklist-display">
      <div class="checklist-empty">No checklist items yet.</div>
    </div>
  </div>

  <!-- Panel 2: Notes -->
  <div class="panel">
    <div class="panel-header">Assignment Notes</div>
    <div class="panel-body">
      <div class="notes-text" id="notes-display">No notes have been posted yet.</div>
    </div>
  </div>

  <!-- Panel 3: YouTube -->
  <div class="panel">
    <div class="panel-header">Class Video</div>
    <div class="yt-body">
      <div class="yt-placeholder" id="yt-placeholder">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M21.582 6.186a2.506 2.506 0 0 0-1.765-1.771C18.254 4 12 4 12 4s-6.254 0-7.817.415A2.506 2.506 0 0 0 2.418 6.186 26.25 26.25 0 0 0 2 12a26.25 26.25 0 0 0 .418 5.814 2.506 2.506 0 0 0 1.765 1.771C5.746 20 12 20 12 20s6.254 0 7.817-.415a2.506 2.506 0 0 0 1.765-1.771A26.25 26.25 0 0 0 22 12a26.25 26.25 0 0 0-.418-5.814zM9.954 15.5v-7l6.181 3.5-6.181 3.5z"/>
        </svg>
        <span>No video loaded</span>
      </div>
      <div class="yt-error-state" id="yt-error-state">
        <div class="err-icon">⚠</div>
        <div class="err-title">Video unavailable</div>
        <div class="err-sub" id="yt-error-msg">This video cannot be embedded.</div>
      </div>
      <iframe id="yt-iframe" style="display:none"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen></iframe>
    </div>
  </div>

  <!-- Panel 4: Class Color / Period -->
  <div class="class-panel" id="class-panel">
    <div class="class-period-label" id="period-label">Period —</div>
    <div class="class-name-big" id="class-name">—</div>
    <div class="class-time-range" id="class-time-range"></div>
    <div class="class-remaining" id="class-remaining"></div>
  </div>

</div>

<script>
'use strict';

// ─── SCHEDULE ─────────────────────────────────────────────────────────────────
const PERIODS = [
  { n: 1, s: [8,50],  e: [9,50]  },
  { n: 2, s: [9,50],  e: [10,40] },
  { n: 3, s: [10,40], e: [11,30] },
  { n: 4, s: [11,30], e: [12,20] },
  { n: 5, s: [12,20], e: [13,0]  },
  { n: 6, s: [13,0],  e: [13,50] },
  { n: 7, s: [13,50], e: [14,40] },
  { n: 8, s: [14,40], e: [15,30] },
];

const SCHEDULE = {
  1: ['Red',   'Yellow', null,       null, null, 'Blue',  'Green',  'Purple'],  // Mon
  2: ['Red',   'Blue',   'Skills',   null, null, null,    'Green',  'Purple'],  // Tue
  3: ['Red',   'Yellow', 'CL Prep',  null, null, null,    null,     null    ],  // Wed
  4: ['Red',   'Yellow', 'Skills',   null, null, 'Blue',  'Green',  'Purple'],  // Thu
  5: ['Blue',  'Yellow', 'CL Prep',  null, null, null,    'Green',  'Purple'],  // Fri
};

const COLOR_MAP = {
  'Red':     { bg: '#991b1b', fg: '#fff' },
  'Yellow':  { bg: '#92400e', fg: '#fff' },
  'Blue':    { bg: '#1e40af', fg: '#fff' },
  'Green':   { bg: '#166534', fg: '#fff' },
  'Purple':  { bg: '#5b21b6', fg: '#fff' },
  'Skills':  { bg: '#374151', fg: '#d1d5db' },
  'CL Prep': { bg: '#374151', fg: '#d1d5db' },
};

const NOCLASS = { bg: '#161b22', fg: '#7d8590', border: '#30363d' };

// ─── HELPERS ──────────────────────────────────────────────────────────────────
function toMin(h, m)   { return h * 60 + m; }
function fmtTime(h, m) { return `${h % 12 || 12}:${String(m).padStart(2,'0')} ${h >= 12 ? 'PM' : 'AM'}`; }
function esc(s)        { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ─── CLOCK ────────────────────────────────────────────────────────────────────
const DAYS   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function updateClock() {
  const now = new Date();
  const h = now.getHours(), m = now.getMinutes();
  document.getElementById('clock').textContent =
    `${h % 12 || 12}:${String(m).padStart(2,'0')} ${h >= 12 ? 'PM' : 'AM'}`;
  document.getElementById('date-display').textContent =
    `${DAYS[now.getDay()]}, ${MONTHS[now.getMonth()]} ${now.getDate()}, ${now.getFullYear()}`;
}

// ─── CLASS PANEL ──────────────────────────────────────────────────────────────
function updateClassPanel() {
  const now      = new Date();
  const dayIdx   = now.getDay();
  const curMin   = toMin(now.getHours(), now.getMinutes());
  const panel    = document.getElementById('class-panel');
  const nameEl   = document.getElementById('class-name');
  const periodEl = document.getElementById('period-label');
  const rangeEl  = document.getElementById('class-time-range');
  const remEl    = document.getElementById('class-remaining');

  function applyStyle(style) {
    panel.style.backgroundColor = style.bg;
    panel.style.color           = style.fg;
    panel.style.borderColor     = style.border || 'transparent';
  }

  if (!SCHEDULE[dayIdx]) {
    applyStyle(NOCLASS);
    periodEl.textContent = 'Weekend';
    nameEl.textContent   = 'No School';
    rangeEl.textContent  = '';
    remEl.textContent    = '';
    return;
  }

  let slot = null;
  for (let i = 0; i < PERIODS.length; i++) {
    const p = PERIODS[i];
    const s = toMin(...p.s), e = toMin(...p.e);
    if (curMin >= s && curMin < e) {
      slot = { period: p, color: SCHEDULE[dayIdx][i], endMin: e };
      break;
    }
  }

  if (!slot) {
    applyStyle(NOCLASS);
    periodEl.textContent = '—';
    nameEl.textContent   = 'No Class';
    rangeEl.textContent  = 'Outside class hours';
    remEl.textContent    = '';
    return;
  }

  const { period, color, endMin } = slot;
  periodEl.textContent = `Period ${period.n}`;
  rangeEl.textContent  = `${fmtTime(...period.s)} \u2013 ${fmtTime(...period.e)}`;
  remEl.textContent    = `${endMin - curMin} min remaining`;

  if (!color) {
    applyStyle(NOCLASS);
    nameEl.textContent = 'Free Period';
    return;
  }

  applyStyle(COLOR_MAP[color] || NOCLASS);
  nameEl.textContent = (color === 'Skills' || color === 'CL Prep') ? color : `${color} Class`;
}

// ─── DATA POLLING ─────────────────────────────────────────────────────────────
let lastVideoId = null;

function loadDashboard() {
  let data = { notes: '', checklist: [], youtubeId: null };
  try {
    const raw = localStorage.getItem('cs_dashboard_data');
    if (raw) data = JSON.parse(raw);
  } catch(e) {}

  // Notes
  document.getElementById('notes-display').textContent =
    (data.notes && data.notes.trim()) ? data.notes : 'No notes have been posted yet.';

  // Checklist
  const listEl = document.getElementById('checklist-display');
  if (!data.checklist || data.checklist.length === 0) {
    listEl.innerHTML = '<div class="checklist-empty">No checklist items yet.</div>';
  } else {
    listEl.innerHTML = data.checklist.map(item => `
      <div class="checklist-item${item.done ? ' done' : ''}">
        <div class="check-circle">
          ${item.done
            ? '<svg width="12" height="12" viewBox="0 0 24 24" fill="white"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>'
            : ''}
        </div>
        <span class="item-text">${esc(item.text)}</span>
      </div>
    `).join('');
  }

  // YouTube — only update src when ID changes to avoid interrupting playback
  const newId = data.youtubeId || null;
  if (newId !== lastVideoId) {
    lastVideoId = newId;
    const iframe   = document.getElementById('yt-iframe');
    const pholder  = document.getElementById('yt-placeholder');
    const errState = document.getElementById('yt-error-state');
    if (newId) {
      iframe.src             = `https://www.youtube.com/embed/${newId}?enablejsapi=1&rel=0`;
      iframe.style.display   = 'block';
      pholder.style.display  = 'none';
      errState.style.display = 'none';
    } else {
      iframe.src             = '';
      iframe.style.display   = 'none';
      errState.style.display = 'none';
      pholder.style.display  = 'flex';
    }
  }
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
updateClock();
updateClassPanel();
loadDashboard();

setInterval(updateClock,       1000);
setInterval(updateClassPanel, 30000);
setInterval(loadDashboard,     5000);

// YouTube embed error detection
window.addEventListener('message', function(e) {
  if (!e.data || typeof e.data !== 'string') return;
  try {
    const msg = JSON.parse(e.data);
    if (msg.event !== 'onError') return;
    const code = msg.info;
    let text = 'This video cannot be embedded.';
    if (code === 100) text = 'Video is private or unavailable.';
    if (code === 101 || code === 150 || code === 153)
      text = 'The video owner has disabled embedding. Ask your teacher to select a different video.';
    document.getElementById('yt-error-msg').textContent     = text;
    document.getElementById('yt-iframe').style.display      = 'none';
    document.getElementById('yt-error-state').style.display = 'flex';
  } catch(err) {}
});
</script>
</body>
</html>
